<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clauditor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<link rel="stylesheet" href="/ui/estilo.css">
</head>
<body>
<nav id="menu">
  <div class="menu"><button class="titulo">Archivo</button><div class="desplegable">
      <button data-accion="nuevo" data-solo="escritorio"><i data-ico="file-plus"></i><span>Proyecto nuevo…</span><kbd>Ctrl+N</kbd></button>
      <button data-accion="abrir" data-solo="escritorio"><i data-ico="folder-open"></i><span>Abrir proyecto…</span><kbd>Ctrl+O</kbd></button>
      <div class="sub" data-solo="escritorio"><button data-submenu="recientes"><i data-ico="clock"></i><span>Abrir reciente</span><i data-ico="chevron-right" class="flecha"></i></button><div class="desplegable" id="menuRecientes"></div></div>
      <hr>
      <button data-accion="guardar"><i data-ico="save"></i><span>Guardar versión</span><kbd>Ctrl+S</kbd></button>
      <button data-accion="versiones"><i data-ico="history"></i><span>Versiones guardadas…</span><kbd></kbd></button>
      <hr>
      <button data-accion="importar"><i data-ico="upload"></i><span>Importar proyecto (.json)…</span><kbd></kbd></button>
      <div class="sub"><button data-submenu="exportar"><i data-ico="download"></i><span>Exportar</span><i data-ico="chevron-right" class="flecha"></i></button><div class="desplegable">
        <button data-accion="exp-json"><i data-ico="file-text"></i><span>Proyecto completo (.json)</span><kbd></kbd></button>
        <button data-accion="exp-fcpxml"><i data-ico="film"></i><span>Para DaVinci Resolve / Final Cut (.fcpxml)</span><kbd></kbd></button>
        <button data-accion="exp-comentarios"><i data-ico="message"></i><span>Comentarios (.md)</span><kbd></kbd></button>
        <button data-accion="exp-guion"><i data-ico="list"></i><span>Guion y notas (.txt)</span><kbd></kbd></button>
        <hr>
        <button disabled title="Todavía no: el render final se hace en otro editor (exporta a FCPXML)"><i data-ico="film"></i><span>Vídeo final… (próximamente)</span><kbd></kbd></button>
      </div></div>
      <hr>
      <button data-accion="carpeta" data-solo="escritorio"><i data-ico="folder"></i><span>Abrir carpeta del proyecto</span><kbd></kbd></button>
      <button data-accion="salir" data-solo="escritorio"><i data-ico="log-out"></i><span>Salir</span><kbd>Ctrl+Q</kbd></button>
  </div></div>
  <div class="menu"><button class="titulo">Editar</button><div class="desplegable">
      <button data-accion="deshacer"><i data-ico="undo"></i><span>Deshacer</span><kbd>Ctrl+Z</kbd></button>
      <button data-accion="rehacer"><i data-ico="redo"></i><span>Rehacer</span><kbd>Ctrl+Y</kbd></button>
      <hr>
      <button data-accion="editar-clip"><i data-ico="pencil"></i><span>Editar clip…</span><kbd>Intro</kbd></button>
      <button data-accion="dividir"><i data-ico="scissors"></i><span>Dividir en el cabezal</span><kbd>S</kbd></button>
      <button data-accion="borrar"><i data-ico="trash"></i><span>Borrar</span><kbd>Supr</kbd></button>
      <button data-accion="borrar-hueco"><i data-ico="trash"></i><span>Borrar y cerrar el hueco</span><kbd>Mayús+Supr</kbd></button>
      <hr>
      <button data-accion="seleccionar-todo"><i data-ico="select-all"></i><span>Seleccionar todo</span><kbd>Ctrl+A</kbd></button>
      <button data-accion="seleccionar-nada"><i data-ico="x"></i><span>Quitar la selección</span><kbd>Esc</kbd></button>
      <hr>
      <button data-accion="comentar"><i data-ico="message"></i><span>Comentar en el cabezal</span><kbd>C</kbd></button>
      <button data-accion="marcador"><i data-ico="bookmark"></i><span>Marcador en el cabezal</span><kbd>M</kbd></button>
  </div></div>
  <div class="menu"><button class="titulo">Ver</button><div class="desplegable">
      <button data-accion="acercar"><i data-ico="zoom-in"></i><span>Acercar</span><kbd>+</kbd></button>
      <button data-accion="alejar"><i data-ico="zoom-out"></i><span>Alejar</span><kbd>−</kbd></button>
      <button data-accion="ajustar"><i data-ico="fit"></i><span>Ver todo el montaje</span><kbd></kbd></button>
      <hr>
      <button data-accion="ir-inicio"><i data-ico="to-start"></i><span>Ir al principio</span><kbd>Inicio</kbd></button>
      <button data-accion="ir-fin"><i data-ico="to-end"></i><span>Ir al final</span><kbd>Fin</kbd></button>
      <hr>
      <button data-accion="ver-guion" data-check="chkSubs"><i data-ico="captions"></i><span>Guion en el visor</span><kbd></kbd></button>
      <button data-accion="ver-graficos" data-check="chkGraficos"><i data-ico="image"></i><span>Gráficos por hacer</span><kbd></kbd></button>
      <hr>
      <button data-accion="panel-clip"><i data-ico="panel"></i><span>Panel del clip</span><kbd></kbd></button>
      <button data-accion="panel-comentarios"><i data-ico="message"></i><span>Panel de comentarios</span><kbd></kbd></button>
      <button data-accion="panel-actividad"><i data-ico="history"></i><span>Panel de actividad</span><kbd></kbd></button>
      <hr>
      <button data-accion="recargar"><i data-ico="refresh"></i><span>Recargar</span><kbd>F5</kbd></button>
      <button data-accion="pantalla"><i data-ico="maximize"></i><span>Pantalla completa</span><kbd>F11</kbd></button>
      <button data-accion="depurar" data-solo="escritorio"><i data-ico="terminal"></i><span>Herramientas de depuración</span><kbd>F12</kbd></button>
  </div></div>
  <div class="menu"><button class="titulo">Ayuda</button><div class="desplegable">
      <button data-accion="atajos"><i data-ico="keyboard"></i><span>Atajos de teclado</span><kbd></kbd></button>
      <button data-accion="github"><i data-ico="github"></i><span>Clauditor en GitHub</span><kbd></kbd></button>
      <hr>
      <button data-accion="acerca"><i data-ico="info"></i><span>Acerca de Clauditor</span><kbd></kbd></button>
  </div></div>
  <span id="nombreProyecto" class="tenue"></span>
</nav>
<header id="barra">
  <strong id="titulo">Clauditor</strong>
  <div class="controles">
    <button id="bInicio" class="icono" title="Al principio (Inicio)"><i data-ico="skip-back"></i></button>
    <button id="bAtras" class="icono" title="Un fotograma atrás (←)"><i data-ico="step-back"></i></button>
    <button id="bPlay" class="icono grande" title="Reproducir / parar (espacio)"><i data-ico="play"></i></button>
    <button id="bAdelante" class="icono" title="Un fotograma adelante (→)"><i data-ico="step-forward"></i></button>
    <span id="tc">00:00:00</span><span id="tcTotal">/ 00:00:00</span>
  </div>
  <div class="controles">
    <button id="bDividir" title="Dividir en el cabezal (S)"><i data-ico="scissors"></i> Dividir</button>
    <button id="bBorrar" title="Borrar selección (Supr). Mayús+Supr cierra el hueco"><i data-ico="trash"></i> Borrar</button>
    <button id="bDeshacer" title="Deshacer (Ctrl+Z)"><i data-ico="undo"></i> Deshacer</button>
    <button id="bRehacer" class="icono" title="Rehacer (Ctrl+Y)"><i data-ico="redo"></i></button>
    <button id="bComentar" class="acento" title="Comentar en el cabezal (C)"><i data-ico="message"></i> Comentar</button>
  </div>
  <div class="controles">
    <label class="chk"><input type="checkbox" id="chkSubs" checked> Guion en el visor</label>
    <label class="chk" title="Etiqueta en la esquina donde irá cada gráfico que falta por hacer"><input type="checkbox" id="chkGraficos" checked> Gráficos por hacer</label>
    <button id="bMenos" class="icono" title="Alejar (−)"><i data-ico="minus"></i></button><button id="bAjustar" title="Ver todo"><i data-ico="fit"></i> Ajustar</button><button id="bMas" class="icono" title="Acercar (+)"><i data-ico="plus"></i></button>
  </div>
  <span id="conexion" title="Conexión con el servidor"></span>
</header>

<main id="arriba">
  <aside id="medios">
    <div class="cab">
      <input id="filtro" placeholder="Buscar medio…">
      <select id="filtroTipo"><option value="">Todo</option><option value="video">Vídeos</option><option value="foto">Fotos</option><option value="animacion">Animaciones</option><option value="audio">Audio</option></select>
    </div>
    <div id="listaMedios"></div>
    <div class="pie" id="estadoProxies"></div>
  </aside>

  <section id="visorCaja">
    <div id="visor"><div id="capas"></div><div id="subtitulo"></div><div id="aviso"></div></div>
    <div id="infoPlano"></div>
  </section>

  <aside id="lateral">
    <nav class="pestanas">
      <button data-p="clip" class="activa">Clip</button>
      <button data-p="comentarios">Comentarios <span id="nComentarios"></span></button>
      <button data-p="actividad">Actividad</button>
    </nav>
    <div id="pClip" class="panel"></div>
    <div id="pComentarios" class="panel oculto">
      <form id="formComentario">
        <div id="dondeComentario"></div>
        <textarea id="textoComentario" rows="3" placeholder="Qué quieres cambiar aquí. Claude lo leerá cuando se lo pidas."></textarea>
        <button type="submit" class="acento">Añadir comentario</button>
        <label class="chk"><input type="checkbox" id="chkHechos"> Ver también los hechos</label>
      </form>
      <div id="listaComentarios"></div>
    </div>
    <div id="pActividad" class="panel oculto"><div id="listaActividad"></div></div>
  </aside>
</main>

<div id="separador" title="Arrastra para cambiar el alto"></div>

<section id="linea">
  <div id="cabezasPistas"><div class="regla-hueco"></div></div>
  <div id="scrollLinea">
    <div id="lienzo">
      <div id="regla"></div>
      <div id="pistas"></div>
      <div id="cabezal"><div class="asa"></div></div>
    </div>
  </div>
</section>

<!-- Editor de un clip (doble clic en la línea de tiempo) -->
<div id="modalClip" class="modal oculto">
  <div class="caja">
    <div class="mcCab"><strong id="mcTitulo"></strong><span id="mcSub" class="tenue"></span><button id="mcCerrar" class="icono" title="Cerrar sin cambiar (Esc)"><i data-ico="x"></i></button></div>
    <div id="mcVisor"><video id="mcVideo" preload="auto" playsinline></video><audio id="mcAudio" preload="auto"></audio><img id="mcFoto" alt=""><div id="mcTexto"></div></div>
    <div class="mcTransporte">
      <button id="mcIrEntrada" class="icono" title="Ir a la entrada (Inicio)"><i data-ico="to-start"></i></button>
      <button id="mcPlay" class="icono grande" title="Reproducir / parar (Espacio)"><i data-ico="play"></i></button>
      <button id="mcVerCorte" title="Reproducir el corte de principio a fin"><i data-ico="play"></i> Corte</button>
      <button id="mcIrSalida" class="icono" title="Ir a la salida (Fin)"><i data-ico="to-end"></i></button>
      <span id="mcTc"></span>
      <span class="tenue mcAyuda">I / O marcan entrada y salida en el cabezal · ←/→ fotograma (Mayús: 1 s) · Ctrl+rueda zoom · arrastra el corte para deslizarlo</span>
    </div>
    <div id="mcTira">
      <div id="mcMinis"></div>
      <div id="mcFrases"></div>
      <div id="mcRango"><div class="asa i" title="Entrada"></div><div class="asa f" title="Salida"></div></div>
      <div id="mcCabezal"></div>
      <div id="mcEscala"></div>
    </div>
    <div class="mcCampos">
      <div class="mcLado" id="mcLadoEntrada">
        <span class="tenue">Entrada</span>
        <button data-mc="entrada" data-d="-1">−1 s</button><button data-mc="entrada" data-d="-f">−1 f</button>
        <input id="mcEntrada" size="9">
        <button data-mc="entrada" data-d="+f">+1 f</button><button data-mc="entrada" data-d="+1">+1 s</button>
        <button id="mcMarcarEntrada" title="Entrada en el cabezal (I)">Marcar aquí</button>
      </div>
      <div class="mcLado">
        <span class="tenue">Salida</span>
        <button data-mc="salida" data-d="-1">−1 s</button><button data-mc="salida" data-d="-f">−1 f</button>
        <input id="mcSalida" size="9">
        <button data-mc="salida" data-d="+f">+1 f</button><button data-mc="salida" data-d="+1">+1 s</button>
        <button id="mcMarcarSalida" title="Salida en el cabezal (O)">Marcar aquí</button>
      </div>
    </div>
    <div class="mcPie">
      <span id="mcDuracion"></span>
      <label class="chk"><input type="checkbox" id="mcCadena" checked> Mover lo que va detrás para que encaje</label>
      <span id="mcEfecto" class="tenue"></span>
      <span class="hueco"></span>
      <button id="mcCancelar">Cancelar</button>
      <button id="mcAplicar" class="acento" title="Aplicar (Intro)">Aplicar</button>
    </div>
  </div>
</div>

<!-- Diálogo genérico (versiones, atajos, acerca de, pedir un nombre) -->
<div id="dialogo" class="modal oculto"><div class="caja estrecha">
  <div class="mcCab"><strong id="dlgTitulo"></strong><button id="dlgCerrar" class="icono" title="Cerrar (Esc)"><i data-ico="x"></i></button></div>
  <div id="dlgCuerpo"></div>
  <div class="mcPie" id="dlgPie"></div>
</div></div>

<script src="/ui/iconos.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
